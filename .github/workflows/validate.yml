name: Validate J.A.R.V.I.S

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate PWA manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('frontend/manifest.json', 'utf8')); console.log('manifest.json is valid')"
